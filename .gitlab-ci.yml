# GitLab CI/CD Pipeline for Philibert
# Builds Electron app for Windows, macOS, and Linux
# Uses shell executor with docker run for containerized builds

stages:
  - test
  - vendor
  - build
  - release
  - cleanup

variables:
  # Node.js version
  NODE_VERSION: "25"
  # Package registry for auto-updates
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic"
  # Disable git clean during checkout - we handle cleanup ourselves after fixing permissions
  GIT_CLEAN_FLAGS: none
  # whisper.cpp release we compile and ship for speech-to-text. Bump this to
  # move the binary; the vendor job keys its published artifact on this value,
  # so nothing is rebuilt until it changes.
  WHISPER_VERSION: "v1.9.5"

# Common cleanup template - fixes root-owned files from docker
# Uses docker to run chown as root (since host doesn't have passwordless sudo)
.docker_cleanup:
  before_script:
    # Fix permissions from any previous failed runs (using docker to get root)
    - docker run --rm -v "$CI_PROJECT_DIR:/app" alpine chown -R $(id -u):$(id -g) /app || true
    # Now clean up old files (git clean was disabled via GIT_CLEAN_FLAGS)
    - git clean -ffdx || true
    # Reclaim containers left behind by previous (possibly OOM-killed) jobs.
    # Containers only — images are kept so they don't get re-pulled.
    - docker container prune -f || true
    # Show available disk space and memory for diagnostics
    - df -h "$CI_PROJECT_DIR" || true
    - free -h || true
    # Jobs are being OOM-killed with 0.5-1.6Gi available while the runner
    # already reports 3.5-4.6Gi used before any job starts, and container
    # prune reclaims 0B — so the memory belongs to something other than this
    # pipeline. Name it rather than keep guessing at mitigations.
    - echo "=== top RSS consumers on runner ==="
    - ps -eo rss,pid,etimes,comm --sort=-rss 2>/dev/null | head -15 | awk 'NR==1{print} NR>1{printf "%8.0f MB  pid=%-8s age=%-8ss  %s\n", $1/1024, $2, $3, $4}' || true
    - echo "=== docker resource usage ==="
    - docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' 2>/dev/null || true
    - docker system df 2>/dev/null || true
  after_script:
    # Always fix permissions after job (even on failure)
    # NOTE: Do NOT remove out/out-online here - after_script runs BEFORE artifact upload
    # Old build artifacts are cleaned by git clean -ffdx in before_script of the next job
    - docker run --rm -v "$CI_PROJECT_DIR:/app" alpine chown -R $(id -u):$(id -g) /app || true

# =============================================================================
# TEST STAGE
# =============================================================================

lint:
  stage: test
  # Serialized for two reasons, both observed in pipeline 5969:
  #  - The runner handed `lint` and `test` the SAME concurrent slot while they
  #    overlapped, so both ran `git clean -ffdx` and `npm ci` inside one build
  #    directory, wiping each other's node_modules.
  #  - Three simultaneous `npm ci` runs on a 5.7Gi swapless runner OOM-killed
  #    one of them ("Killed" during install, all three jobs failing together
  #    while passing locally).
  resource_group: test-suite
  tags:
    - shell
  extends: .docker_cleanup
  script:
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        node:${NODE_VERSION} \
        sh -c "npm ci --prefer-offline && npm run lint"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  stage: test
  # Serialized for two reasons, both observed in pipeline 5969:
  #  - The runner handed `lint` and `test` the SAME concurrent slot while they
  #    overlapped, so both ran `git clean -ffdx` and `npm ci` inside one build
  #    directory, wiping each other's node_modules.
  #  - Three simultaneous `npm ci` runs on a 5.7Gi swapless runner OOM-killed
  #    one of them ("Killed" during install, all three jobs failing together
  #    while passing locally).
  resource_group: test-suite
  tags:
    - shell
  extends: .docker_cleanup
  script:
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        node:${NODE_VERSION} \
        sh -c "npm ci --prefer-offline && npm run test"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

typecheck:
  stage: test
  # Serialized for two reasons, both observed in pipeline 5969:
  #  - The runner handed `lint` and `test` the SAME concurrent slot while they
  #    overlapped, so both ran `git clean -ffdx` and `npm ci` inside one build
  #    directory, wiping each other's node_modules.
  #  - Three simultaneous `npm ci` runs on a 5.7Gi swapless runner OOM-killed
  #    one of them ("Killed" during install, all three jobs failing together
  #    while passing locally).
  resource_group: test-suite
  tags:
    - shell
  extends: .docker_cleanup
  script:
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        node:${NODE_VERSION} \
        sh -c "npm ci --prefer-offline && npm run typecheck"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  allow_failure: true  # Allow failure until all type issues are resolved

# =============================================================================
# BUILD STAGE
# =============================================================================

# Linux build template
# Pull the compiled whisper-cli into vendor/ so forge packages it.
#
# A curl in the job's own script rather than an artifact dependency: every
# packaging job extends .docker_cleanup, whose `git clean -ffdx` runs after
# artifacts are restored and would delete them.
#
# Never fatal. A release cut before the vendor job ran for this
# WHISPER_VERSION simply ships without dictation — WhisperPaths finds no
# binary and the feature reports itself unavailable — and that is preferable
# to failing the release over an optional component.
.whisper_fetch:
  script:
    - |
      if [ -n "${WHISPER_PLATFORM:-}" ]; then
        WHISPER_BIN="whisper-cli"
        [ "$WHISPER_PLATFORM" = "win32-x64" ] && WHISPER_BIN="whisper-cli.exe"
        mkdir -p "vendor/whisper/$WHISPER_PLATFORM"
        if curl --fail --location --silent --show-error \
             --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --output "vendor/whisper/$WHISPER_PLATFORM/$WHISPER_BIN" \
             "${PACKAGE_REGISTRY_URL}/whisper/${WHISPER_VERSION}/whisper-cli-$WHISPER_PLATFORM"; then
          chmod +x "vendor/whisper/$WHISPER_PLATFORM/$WHISPER_BIN"
          echo "whisper-cli ${WHISPER_VERSION} fetched for $WHISPER_PLATFORM"
        else
          rm -rf "vendor/whisper/$WHISPER_PLATFORM"
          echo "WARNING: whisper-cli ${WHISPER_VERSION} is not in the registry for $WHISPER_PLATFORM"
          echo "WARNING: this build will ship without dictation — run vendor:whisper:${WHISPER_PLATFORM%%-*} to publish it"
        fi
      fi

.build_linux:
  stage: build
  variables:
    WHISPER_PLATFORM: linux-x64
  # All packaging jobs share one resource group so they never run concurrently.
  # The runner has 5.7Gi and no swap; two simultaneous Electron packages, each
  # extracting the ~265MB bundled Claude Code binary, get OOM-killed (SIGKILL,
  # surfaced by Forge as "npm install exited with code: 137"). The Windows jobs
  # were already serialized against each other, but build:linux was not in the
  # group, so it overlapped both of them.
  resource_group: package-build
  tags:
    - shell
  extends: .docker_cleanup
  script:
    - !reference [.whisper_fetch, script]
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        node:${NODE_VERSION} \
        bash -c "apt-get update && apt-get install -y build-essential python3 dpkg fakeroot rpm && npm ci --maxsockets 1 --no-audit --no-fund && npm run make -- --platform=linux"

# Linux build for tags (with artifacts for release)
build:linux:
  extends: .build_linux
  artifacts:
    name: "philibert-linux-${CI_COMMIT_REF_SLUG}"
    paths:
      - out/make/**/*.deb
      - out/make/**/*.rpm
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# Linux build for manual testing (no artifacts - too large for GitLab limit)
build:linux:manual:
  extends: .build_linux
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# =============================================================================
# VENDOR STAGE — third-party binaries we ship
# =============================================================================
# whisper.cpp publishes no prebuilt binaries at all (the v1.9.5 release's asset
# list is empty), so the speech-to-text binary has to be compiled here.
#
# It is deliberately NOT compiled inside the packaging jobs. This runner has
# 5.7Gi and no swap, and those jobs already OOM under their own weight — see
# the resource_group comment on .build_linux. This job compiles once per pinned
# WHISPER_VERSION, smoke-tests the result, and publishes it to the package
# registry; packaging jobs fetch it with curl.
#
# Fetching rather than passing artifacts is also deliberate: every packaging
# job extends .docker_cleanup, whose `git clean -ffdx` runs after artifacts are
# restored and would delete them. publish:packages is the one job that consumes
# artifacts and it pointedly does not extend that template.
#
# Manual, because the output only changes when WHISPER_VERSION does. Run it
# after bumping that variable, then the packaging jobs pick the new binary up.

vendor:whisper:linux:
  stage: vendor
  tags:
    - shell
  extends: .docker_cleanup
  # Never overlap a compile with a packaging job on a 5.7Gi no-swap runner.
  resource_group: package-build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        -e WHISPER_VERSION="$WHISPER_VERSION" \
        node:${NODE_VERSION} \
        bash -euxc '
          apt-get update
          apt-get install -y --no-install-recommends cmake build-essential git curl ca-certificates

          rm -rf /tmp/whisper
          git clone --depth 1 --branch "$WHISPER_VERSION" https://github.com/ggml-org/whisper.cpp.git /tmp/whisper
          cd /tmp/whisper

          # Static link so the shipped artifact is one self-contained file with
          # no libwhisper/libggml .so files to place next to it.
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          # -j2, not nproc: see the memory note above.
          cmake --build build -j2 --target whisper-cli

          test -x build/bin/whisper-cli

          # Smoke test the exact contract the app depends on: with -nt -np,
          # stdout must be the transcript and nothing else. Proving this here
          # is the whole reason the job exists — it cannot be verified without
          # a compiler, and getting it wrong is silent at runtime.
          curl -fsSL -o /tmp/ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          ./build/bin/whisper-cli -m /tmp/ggml-tiny.en.bin -f samples/jfk.wav -nt -np > /tmp/out.txt
          echo "--- whisper-cli stdout ---"
          cat /tmp/out.txt
          echo "--- end ---"
          grep -qi "country" /tmp/out.txt

          mkdir -p /app/vendor/whisper/linux-x64
          cp build/bin/whisper-cli /app/vendor/whisper/linux-x64/whisper-cli
          strip /app/vendor/whisper/linux-x64/whisper-cli || true
        '
    - ls -la vendor/whisper/linux-x64/
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file vendor/whisper/linux-x64/whisper-cli \
        "${PACKAGE_REGISTRY_URL}/whisper/${WHISPER_VERSION}/whisper-cli-linux-x64"
    - echo "Published whisper-cli ${WHISPER_VERSION} for linux-x64"

# Windows build, cross-compiled with mingw-w64.
#
# Cross-compiling rather than building under wine: the wine-mono image exists
# to run the NSIS packager, not a C++ toolchain, and a native Windows compile
# would need a Windows runner this project does not have.
#
# No smoke test here, unlike the linux job — the binary cannot be executed on
# this runner. The linux job proves the CLI contract (that `-nt -np` puts the
# transcript on stdout and nothing else); this one proves only that the same
# source cross-compiles and links. What it cannot prove has to be checked by
# running the packaged app on Windows.
vendor:whisper:windows:
  stage: vendor
  tags:
    - shell
  extends: .docker_cleanup
  resource_group: package-build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        -e WHISPER_VERSION="$WHISPER_VERSION" \
        debian:trixie \
        bash -euxc '
          apt-get update
          # debian:trixie, not the node image: this is a C++ build that needs
          # no Node, and bookworm (which node:25 builds on) pins mingw-w64 at
          # 10.0.0. That version declares no THREAD_POWER_THROTTLING_STATE at
          # any _WIN32_WINNT level - the thread variants arrived in mingw-w64
          # 11/12 - so ggml-cpu.c cannot compile against it. trixie ships 12.
          #
          # The posix variants matter separately: Debian defaults mingw-w64 to
          # the win32 threading model, which has no std::mutex, and
          # ggml-threading.cpp fails with a missing std::mutex type.
          # mingw-w64 itself is still needed for binutils (windres, objdump,
          # strip).
          # `file` is used for the PE32+ assertion below. It ships in the node
          # image but not in debian:trixie, so it has to be asked for.
          apt-get install -y --no-install-recommends \
            cmake make git curl ca-certificates file \
            mingw-w64 gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix

          # Fail with the actual reason if the toolchain is still too old,
          # rather than 200 lines later as a confusing missing-type error.
          x86_64-w64-mingw32-gcc-posix --version | head -1
          if ! grep -rqs THREAD_POWER_THROTTLING_STATE /usr/share/mingw-w64/include /usr/x86_64-w64-mingw32/include; then
            echo "error: mingw-w64 headers are too old - no THREAD_POWER_THROTTLING_STATE" >&2
            exit 1
          fi

          rm -rf /tmp/whisper-win
          git clone --depth 1 --branch "$WHISPER_VERSION" https://github.com/ggml-org/whisper.cpp.git /tmp/whisper-win
          cd /tmp/whisper-win

          # _WIN32_WINNT=0x0A00 targets Windows 10, which the installers
          # already require. ggml guards its thread-throttling call on
          # `_WIN32_WINNT >= 0x0602` (Windows 8), but mingw-w64 only declares
          # THREAD_POWER_THROTTLING_STATE at 0x0A00 — so the guard passes
          # while the struct does not exist and ggml-cpu.c fails to compile.
          #
          # Static, and statically linked against libstdc++/libgcc too: the
          # packaged app must not depend on mingw runtime DLLs being present
          # on the user machine.
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32 \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_FLAGS="-D_WIN32_WINNT=0x0A00" \
            -DCMAKE_CXX_FLAGS="-D_WIN32_WINNT=0x0A00" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DGGML_OPENMP=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build -j2 --target whisper-cli

          test -f build/bin/whisper-cli.exe

          # Confirm it is actually a Windows binary and not a host one that
          # happened to build, and that nothing dynamic crept back in.
          file build/bin/whisper-cli.exe | tee /tmp/file-out.txt
          grep -q "PE32+" /tmp/file-out.txt

          # The posix toolchain links against libwinpthread unless the static
          # flags take effect, so assert on the imports rather than just
          # printing them. A missing DLL on the user machine would surface as
          # the app silently failing to transcribe, with nothing in any log
          # here to explain it.
          x86_64-w64-mingw32-objdump -p build/bin/whisper-cli.exe \
            | grep -i "DLL Name" | sort -u | tee /tmp/dlls.txt
          # Reject any import whose name begins with "lib". Windows system
          # DLLs do not (KERNEL32, ADVAPI32, msvcrt); mingw runtime DLLs
          # conventionally do (libgcc_s, libstdc++, libwinpthread, libgomp).
          # This started as a list of the three names I happened to think of
          # and let libgomp-1.dll through — a binary that would simply fail to
          # start on a machine without the mingw runtime, with nothing in this
          # log to say why. A rule beats an enumeration here.
          if grep -qiE "DLL Name:[[:space:]]*lib" /tmp/dlls.txt; then
            echo "error: whisper-cli.exe imports a mingw runtime DLL - static linking did not take" >&2
            exit 1
          fi

          mkdir -p /app/vendor/whisper/win32-x64
          cp build/bin/whisper-cli.exe /app/vendor/whisper/win32-x64/whisper-cli.exe
          x86_64-w64-mingw32-strip /app/vendor/whisper/win32-x64/whisper-cli.exe || true
        '
    - ls -la vendor/whisper/win32-x64/
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file vendor/whisper/win32-x64/whisper-cli.exe \
        "${PACKAGE_REGISTRY_URL}/whisper/${WHISPER_VERSION}/whisper-cli-win32-x64"
    - echo "Published whisper-cli ${WHISPER_VERSION} for win32-x64"

# =============================================================================
# Windows Build Templates
# =============================================================================
# Two variants:
# - OFFLINE (full bundle): Node.js + Git bundled, larger download, instant install
# - ONLINE (light bundle): Downloads Node.js + Git during install, smaller download
#
# Auto-update always downloads the OFFLINE (full) bundle for reliability

# Windows build uses Forge for packaging + electron-builder for NSIS installer.
# Forge handles Vite compilation, native module unpacking, extraResource bundling,
# and the packageAfterPrune hook (external modules, cross-platform binaries).
# electron-builder then creates the NSIS installer from the packaged app via --prepackaged.

# Windows OFFLINE build template (bundles Node.js + Git)
.build_windows_offline:
  stage: build
  variables:
    WHISPER_PLATFORM: win32-x64
  # All packaging jobs share one resource group so they never run concurrently.
  # The runner has 5.7Gi and no swap; two simultaneous Electron packages, each
  # extracting the ~265MB bundled Claude Code binary, get OOM-killed (SIGKILL,
  # surfaced by Forge as "npm install exited with code: 137"). The Windows jobs
  # were already serialized against each other, but build:linux was not in the
  # group, so it overlapped both of them.
  resource_group: package-build
  tags:
    - shell
  extends: .docker_cleanup
  script:
    - !reference [.whisper_fetch, script]
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        -e PHILIBERT_ONLINE_BUILD=false \
        electronuserland/builder:wine-mono \
        bash -c "curl -fsSL https://deb.nodesource.com/setup_${NODE_VERSION}.x | bash - && apt-get install -y nodejs bzip2 && npm ci --maxsockets 1 --no-audit --no-fund && ./scripts/download-node-windows.sh && ./scripts/download-git-bash-windows.sh && npm run package -- --platform=win32 && npx electron-builder --win nsis --x64 --prepackaged 'out/Philibert-win32-x64' --publish never"
    - echo "=== Artifact sizes ==="
    - du -sh out/make/nsis/*.exe 2>/dev/null || true
    - df -h "$CI_PROJECT_DIR" || true

# Windows ONLINE build template (smaller, downloads deps during install)
.build_windows_online:
  stage: build
  variables:
    WHISPER_PLATFORM: win32-x64
  # All packaging jobs share one resource group so they never run concurrently.
  # The runner has 5.7Gi and no swap; two simultaneous Electron packages, each
  # extracting the ~265MB bundled Claude Code binary, get OOM-killed (SIGKILL,
  # surfaced by Forge as "npm install exited with code: 137"). The Windows jobs
  # were already serialized against each other, but build:linux was not in the
  # group, so it overlapped both of them.
  resource_group: package-build
  tags:
    - shell
  extends: .docker_cleanup
  script:
    - !reference [.whisper_fetch, script]
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/app" \
        -w /app \
        -e PHILIBERT_ONLINE_BUILD=true \
        electronuserland/builder:wine-mono \
        bash -c "curl -fsSL https://deb.nodesource.com/setup_${NODE_VERSION}.x | bash - && apt-get install -y nodejs bzip2 && npm ci --maxsockets 1 --no-audit --no-fund && npm run package -- --platform=win32 && npx electron-builder --win nsis --x64 --prepackaged 'out/Philibert-win32-x64' --publish never && mkdir -p out-online/nsis && cp out/make/nsis/*.exe out-online/nsis/"

# Windows OFFLINE build for tags (main installer for auto-updates)
build:windows:
  extends: .build_windows_offline
  artifacts:
    name: "philibert-windows-offline-${CI_COMMIT_REF_SLUG}"
    paths:
      - out/make/nsis/*.exe
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# Windows ONLINE build for tags (smaller download option)
build:windows:online:
  extends: .build_windows_online
  artifacts:
    name: "philibert-windows-online-${CI_COMMIT_REF_SLUG}"
    paths:
      - out-online/nsis/*.exe
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# Windows OFFLINE build for manual testing
build:windows:manual:
  extends: .build_windows_offline
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# Windows ONLINE build for manual testing
build:windows:online:manual:
  extends: .build_windows_online
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# macOS build requires macOS runner (self-hosted or cloud)
# Uncomment when macOS runner is available
# build:macos:
#   stage: build
#   tags:
#     - macos
#   script:
#     - npm ci
#     - npm run make -- --platform=darwin
